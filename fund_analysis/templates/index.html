<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金分析 · 关系网络</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252836;
    --border: #2d3148;
    --accent: #5b6af0;
    --accent2: #7c8cf8;
    --text: #e2e4f0;
    --text-muted: #7b7f9a;
    --danger: #e74c3c;
    --warn: #e67e22;
    --ok: #27ae60;
    --gray: #95a5a6;
    --sidebar-w: 340px;
    --panel-w: 320px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent2);
    letter-spacing: .5px;
  }

  #sidebar-header p {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 3px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    transition: color .2s, border-bottom .2s;
    border-bottom: 2px solid transparent;
  }

  .tab.active {
    color: var(--accent2);
    border-bottom-color: var(--accent2);
  }

  /* Tab content */
  .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 10px; }

  /* Search */
  .search-box {
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 12px;
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--accent); }

  /* Person list */
  .person-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .person-item:hover { border-color: var(--accent); background: #1e2135; }
  .person-item.selected { border-color: var(--accent2); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }

  .person-info { flex: 1; min-width: 0; }
  .person-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

  .risk-badge {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
    flex-shrink: 0;
  }
  .risk-high { background: rgba(231,76,60,.2); color: #e74c3c; }
  .risk-medium { background: rgba(230,126,34,.2); color: #e67e22; }
  .risk-low { background: rgba(39,174,96,.2); color: #27ae60; }
  .risk-unknown { background: rgba(149,165,166,.15); color: #95a5a6; }

  /* Forms */
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
    transition: border-color .2s;
    resize: vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group select option { background: var(--surface2); }

  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-danger { background: rgba(231,76,60,.15); color: var(--danger); border: 1px solid rgba(231,76,60,.3); }
  .btn-danger:hover { background: rgba(231,76,60,.25); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  .row { display: flex; gap: 8px; }
  .row .form-group { flex: 1; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-top: 4px;
  }

  /* ── Main canvas ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #toolbar .tool-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }

  #cy {
    flex: 1;
    background: var(--bg);
  }

  /* Legend */
  #legend {
    position: absolute;
    bottom: 16px;
    left: calc(var(--sidebar-w) + 16px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
  }
  .legend-title { font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 24px; height: 2px; flex-shrink: 0; }

  /* ── Detail Panel ── */
  #detail-panel {
    width: var(--panel-w);
    background: var(--surface);
    border-left: 1px solid var(--border);
    flex-shrink: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }
  #detail-panel.open { display: flex; }

  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
  .panel-close {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .panel-close:hover { background: var(--surface2); color: var(--text); }

  .panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

  .info-block { display: flex; flex-direction: column; gap: 6px; }
  .info-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-key { color: var(--text-muted); width: 70px; flex-shrink: 0; }
  .info-val { color: var(--text); word-break: break-all; }

  .addr-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .addr-tag .chain-badge {
    background: rgba(91,106,240,.2);
    color: var(--accent2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .addr-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }

  .rel-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .rel-item:last-child { border-bottom: none; }
  .rel-type {
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    max-width: 280px;
  }
  #toast.show { opacity: 1; }
  #toast.success { border-color: var(--ok); color: var(--ok); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Empty state */
  .empty { color: var(--text-muted); text-align: center; padding: 20px 0; font-size: 12px; }

  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal h2 { font-size: 15px; font-weight: 600; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>资金关系网络</h1>
    <p>Fund Analysis · Relationship Network</p>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="persons">人员</div>
    <div class="tab" data-tab="add-person">添加</div>
    <div class="tab" data-tab="add-rel">关系</div>
  </div>

  <!-- Persons Tab -->
  <div class="tab-panel active" id="tab-persons">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索姓名、机构、地址…">
    </div>
    <div id="persons-list"></div>
  </div>

  <!-- Add Person Tab -->
  <div class="tab-panel" id="tab-add-person">
    <div class="section-title">基本信息</div>
    <div class="form-group">
      <label>姓名 *</label>
      <input type="text" id="p-name" placeholder="真实姓名或别名">
    </div>
    <div class="row">
      <div class="form-group">
        <label>角色</label>
        <input type="text" id="p-role" placeholder="投资人 / 开发者…">
      </div>
      <div class="form-group">
        <label>风险等级</label>
        <select id="p-risk">
          <option value="unknown">未知</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>所属机构</label>
      <input type="text" id="p-org" placeholder="公司 / 项目名称">
    </div>
    <div class="row">
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="p-email">
      </div>
      <div class="form-group">
        <label>电话</label>
        <input type="text" id="p-phone">
      </div>
    </div>
    <div class="form-group">
      <label>标签（逗号分隔）</label>
      <input type="text" id="p-tags" placeholder="KOL, 做市商, 黑名单…">
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="p-notes" rows="3" placeholder="其他说明…"></textarea>
    </div>

    <div class="divider"></div>
    <div class="section-title">链上地址（可选）</div>
    <div class="row">
      <div class="form-group">
        <label>链</label>
        <select id="a-chain">
          <option>ETH</option><option>BTC</option><option>BSC</option>
          <option>SOL</option><option>TRON</option><option>ARB</option>
          <option>OP</option><option>MATIC</option><option>AVAX</option><option>OTHER</option>
        </select>
      </div>
      <div class="form-group" style="flex:2">
        <label>地址</label>
        <input type="text" id="a-address" placeholder="0x…">
      </div>
    </div>
    <div class="form-group">
      <label>地址标签</label>
      <input type="text" id="a-label" placeholder="冷钱包 / 交易所充值…">
    </div>
    <button class="btn btn-primary" id="btn-create-person">添加人员</button>
  </div>

  <!-- Add Relationship Tab -->
  <div class="tab-panel" id="tab-add-rel">
    <div class="section-title">建立关系</div>
    <div class="form-group">
      <label>人员 A</label>
      <select id="rel-source"></select>
    </div>
    <div class="form-group">
      <label>关系类型</label>
      <select id="rel-type">
        <option value="colleague">同事</option>
        <option value="collaborator">合作伙伴</option>
        <option value="friend">朋友</option>
        <option value="family">家人</option>
        <option value="investor">投资关系</option>
        <option value="suspicious">可疑关联</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>人员 B</label>
      <select id="rel-target"></select>
    </div>
    <div class="form-group">
      <label>强度 (1-5)</label>
      <input type="range" id="rel-strength" min="1" max="5" value="2" style="accent-color:var(--accent)">
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="rel-notes" rows="2" placeholder="关系说明…"></textarea>
    </div>
    <button class="btn btn-primary" id="btn-create-rel">建立关系</button>

    <div class="divider"></div>
    <div class="section-title">现有关系</div>
    <div id="rels-list"></div>
  </div>
</aside>

<!-- ── Main Canvas ── -->
<div id="main" style="position:relative">
  <div id="toolbar">
    <button class="btn btn-ghost btn-sm" id="btn-fit">全览</button>
    <button class="btn btn-ghost btn-sm" id="btn-layout">重排</button>
    <button class="btn btn-ghost btn-sm" id="btn-export">导出图片</button>
    <span class="tool-label">点击节点查看详情 · 拖拽移动节点</span>
  </div>
  <div id="cy"></div>

  <div id="legend">
    <div class="legend-title">图例</div>
    <div class="legend-row"><div class="legend-dot" style="background:#e74c3c"></div>高风险</div>
    <div class="legend-row"><div class="legend-dot" style="background:#e67e22"></div>中风险</div>
    <div class="legend-row"><div class="legend-dot" style="background:#27ae60"></div>低风险</div>
    <div class="legend-row"><div class="legend-dot" style="background:#95a5a6"></div>未知</div>
    <div style="height:6px"></div>
    <div class="legend-row"><div class="legend-line" style="background:#7c8cf8"></div>同事/合作</div>
    <div class="legend-row"><div class="legend-line" style="background:#f39c12"></div>朋友/家人</div>
    <div class="legend-row"><div class="legend-line" style="background:#e74c3c"></div>可疑关联</div>
    <div class="legend-row"><div class="legend-line" style="background:#95a5a6"></div>其他</div>
  </div>
</div>

<!-- ── Detail Panel ── -->
<div id="detail-panel">
  <div class="panel-header">
    <div class="avatar" id="detail-avatar" style="background:#5b6af0">?</div>
    <h2 id="detail-name">-</h2>
    <span class="panel-close" id="panel-close">×</span>
  </div>
  <div class="panel-body">
    <div class="info-block" id="detail-info"></div>
    <div>
      <div class="section-title" style="margin-bottom:8px">链上地址</div>
      <div id="detail-addresses"></div>
      <button class="btn btn-ghost btn-sm" id="btn-add-addr" style="margin-top:8px;width:100%">+ 添加地址</button>
    </div>
    <div>
      <div class="section-title" style="margin-bottom:8px">关系节点</div>
      <div id="detail-rels"></div>
    </div>
    <div class="row">
      <button class="btn btn-ghost btn-sm" id="btn-edit-person" style="flex:1">编辑</button>
      <button class="btn btn-danger btn-sm" id="btn-delete-person" style="flex:1">删除</button>
    </div>
  </div>
</div>

<!-- Add Address Modal -->
<div class="modal-overlay" id="modal-addr">
  <div class="modal">
    <h2>添加链上地址</h2>
    <div class="row">
      <div class="form-group">
        <label>链</label>
        <select id="ma-chain">
          <option>ETH</option><option>BTC</option><option>BSC</option>
          <option>SOL</option><option>TRON</option><option>ARB</option>
          <option>OP</option><option>MATIC</option><option>AVAX</option><option>OTHER</option>
        </select>
      </div>
      <div class="form-group" style="flex:2">
        <label>地址 *</label>
        <input type="text" id="ma-address" placeholder="0x…">
      </div>
    </div>
    <div class="form-group">
      <label>标签</label>
      <input type="text" id="ma-label" placeholder="冷钱包 / 热钱包…">
    </div>
    <div class="form-group">
      <label>备注</label>
      <input type="text" id="ma-notes">
    </div>
    <div class="row">
      <button class="btn btn-ghost" id="btn-modal-cancel" style="flex:1">取消</button>
      <button class="btn btn-primary" id="btn-modal-save" style="flex:1">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';
let cy = null;
let selectedPersonId = null;
let allPersons = [];

// ─── Cytoscape Init ──────────────────────────────────────────────────────────

function edgeColor(type) {
  const map = {
    colleague: '#7c8cf8',
    collaborator: '#5b6af0',
    friend: '#f39c12',
    family: '#e67e22',
    investor: '#27ae60',
    suspicious: '#e74c3c',
    other: '#95a5a6'
  };
  return map[type] || '#95a5a6';
}

function initCy() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      {
        selector: 'node',
        style: {
          'background-color': 'data(color)',
          'label': 'data(label)',
          'color': '#e2e4f0',
          'font-size': '11px',
          'font-family': 'SF Pro Display, PingFang SC, system-ui, sans-serif',
          'text-valign': 'bottom',
          'text-margin-y': '4px',
          'text-outline-color': '#0f1117',
          'text-outline-width': '2px',
          'width': '36px',
          'height': '36px',
          'border-width': '2px',
          'border-color': '#2d3148',
          'transition-property': 'border-color, width, height',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'node:selected',
        style: {
          'border-color': '#7c8cf8',
          'border-width': '3px',
          'width': '42px',
          'height': '42px'
        }
      },
      {
        selector: 'edge',
        style: {
          'line-color': 'data(edgeColor)',
          'target-arrow-color': 'data(edgeColor)',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'width': 'data(edgeWidth)',
          'label': 'data(label)',
          'color': '#7b7f9a',
          'font-size': '9px',
          'text-rotation': 'autorotate',
          'opacity': 0.7
        }
      },
      {
        selector: 'edge:selected',
        style: {
          'opacity': 1,
          'width': 3
        }
      }
    ],
    layout: { name: 'cose' },
    wheelSensitivity: 0.3
  });

  cy.on('tap', 'node', function(e) {
    const node = e.target;
    openDetailPanel(parseInt(node.id()));
  });

  cy.on('tap', function(e) {
    if (e.target === cy) closeDetailPanel();
  });
}

// ─── Graph Data ───────────────────────────────────────────────────────────────

async function loadGraph() {
  const res = await fetch(`${API}/api/graph`);
  const data = await res.json();

  cy.elements().remove();

  const nodes = data.nodes.map(n => ({
    data: { ...n.data, edgeColor: '#2d3148' }
  }));

  const edges = data.edges.map(e => ({
    data: {
      ...e.data,
      edgeColor: edgeColor(e.data.type),
      edgeWidth: Math.max(1, (e.data.strength || 1) * 0.8)
    }
  }));

  cy.add([...nodes, ...edges]);
  runLayout();
}

function runLayout() {
  cy.layout({
    name: 'cose',
    animate: true,
    animationDuration: 600,
    nodeRepulsion: 4500,
    idealEdgeLength: 120,
    gravity: 0.4
  }).run();
}

// ─── Persons List ─────────────────────────────────────────────────────────────

async function loadPersons() {
  const res = await fetch(`${API}/api/persons`);
  allPersons = await res.json();
  renderPersonsList(allPersons);
  populateRelSelects(allPersons);
}

function renderPersonsList(persons) {
  const el = document.getElementById('persons-list');
  if (persons.length === 0) {
    el.innerHTML = '<div class="empty">暂无人员，请先添加</div>';
    return;
  }
  el.innerHTML = persons.map(p => {
    const initials = (p.name || '?').slice(0, 2).toUpperCase();
    const color = { high: '#e74c3c', medium: '#e67e22', low: '#27ae60', unknown: '#5b6af0' }[p.risk_level] || '#5b6af0';
    const addrCount = (p.addresses || []).length;
    return `
      <div class="person-item" data-id="${p.id}" onclick="openDetailPanel(${p.id})">
        <div class="avatar" style="background:${color}">${initials}</div>
        <div class="person-info">
          <div class="person-name">${p.name}</div>
          <div class="person-meta">${p.organization || p.role || '—'} · ${addrCount} 个地址</div>
        </div>
        <span class="risk-badge risk-${p.risk_level || 'unknown'}">${riskLabel(p.risk_level)}</span>
      </div>`;
  }).join('');
}

function riskLabel(r) {
  return { high: '高', medium: '中', low: '低', unknown: '?' }[r] || '?';
}

function populateRelSelects(persons) {
  ['rel-source', 'rel-target'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  });
}

// ─── Relationships List ───────────────────────────────────────────────────────

async function loadRels() {
  const res = await fetch(`${API}/api/relationships`);
  const rels = await res.json();
  const el = document.getElementById('rels-list');
  if (rels.length === 0) {
    el.innerHTML = '<div class="empty">暂无关系</div>';
    return;
  }
  const typeLabels = { colleague:'同事', collaborator:'合作', friend:'朋友', family:'家人', investor:'投资', suspicious:'可疑', other:'其他' };
  el.innerHTML = rels.map(r => `
    <div class="rel-item">
      <span style="flex:1">${r.source_name}</span>
      <span class="rel-type" style="background:${edgeColor(r.type)}22;color:${edgeColor(r.type)}">${typeLabels[r.type]||r.type}</span>
      <span style="flex:1;text-align:right">${r.target_name}</span>
      <button class="btn btn-danger btn-sm" onclick="deleteRel(${r.id})" style="margin-left:6px;padding:3px 7px">✕</button>
    </div>`).join('');
}

// ─── Detail Panel ─────────────────────────────────────────────────────────────

async function openDetailPanel(pid) {
  selectedPersonId = pid;
  const res = await fetch(`${API}/api/persons/${pid}`);
  const p = await res.json();

  const initials = (p.name || '?').slice(0, 2).toUpperCase();
  const color = { high: '#e74c3c', medium: '#e67e22', low: '#27ae60', unknown: '#5b6af0' }[p.risk_level] || '#5b6af0';

  document.getElementById('detail-avatar').textContent = initials;
  document.getElementById('detail-avatar').style.background = color;
  document.getElementById('detail-name').textContent = p.name;

  const fields = [
    ['角色', p.role], ['机构', p.organization],
    ['邮箱', p.email], ['电话', p.phone],
    ['风险', riskLabel(p.risk_level)],
    ['标签', p.tags], ['备注', p.notes]
  ].filter(([, v]) => v);

  document.getElementById('detail-info').innerHTML = fields.length
    ? fields.map(([k, v]) => `<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v}</span></div>`).join('')
    : '<div class="info-row"><span class="info-val" style="color:var(--text-muted)">无基本信息</span></div>';

  const addrs = p.addresses || [];
  document.getElementById('detail-addresses').innerHTML = addrs.length
    ? addrs.map(a => `
        <div class="addr-tag" style="margin-bottom:6px">
          <span class="chain-badge">${a.chain}</span>
          <span class="addr-text" title="${a.address}">${a.label ? a.label + ': ' : ''}${a.address}</span>
          <button onclick="deleteAddr(${a.id})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px">✕</button>
        </div>`).join('')
    : '<div class="empty">无链上地址</div>';

  // Relationships involving this person
  const relRes = await fetch(`${API}/api/relationships`);
  const allRels = await relRes.json();
  const myRels = allRels.filter(r => r.source_id === pid || r.target_id === pid);
  const typeLabels = { colleague:'同事', collaborator:'合作', friend:'朋友', family:'家人', investor:'投资', suspicious:'可疑', other:'其他' };

  document.getElementById('detail-rels').innerHTML = myRels.length
    ? myRels.map(r => {
        const other = r.source_id === pid ? r.target_name : r.source_name;
        return `<div class="rel-item">
          <span class="rel-type" style="background:${edgeColor(r.type)}22;color:${edgeColor(r.type)}">${typeLabels[r.type]||r.type}</span>
          <span style="flex:1">${other}</span>
        </div>`;
      }).join('')
    : '<div class="empty">无关系记录</div>';

  document.getElementById('detail-panel').classList.add('open');

  // Highlight node
  cy.elements().removeClass('selected');
  cy.$(`#${pid}`).select();
}

function closeDetailPanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedPersonId = null;
  cy.elements().unselect();
}

// ─── CRUD Actions ─────────────────────────────────────────────────────────────

document.getElementById('btn-create-person').addEventListener('click', async () => {
  const name = document.getElementById('p-name').value.trim();
  if (!name) { toast('请填写姓名', 'error'); return; }

  const body = {
    name,
    role: document.getElementById('p-role').value.trim() || null,
    organization: document.getElementById('p-org').value.trim() || null,
    email: document.getElementById('p-email').value.trim() || null,
    phone: document.getElementById('p-phone').value.trim() || null,
    tags: document.getElementById('p-tags').value.trim() || null,
    notes: document.getElementById('p-notes').value.trim() || null,
    risk_level: document.getElementById('p-risk').value
  };

  const res = await fetch(`${API}/api/persons`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();

  if (!res.ok) { toast(data.error || '添加失败', 'error'); return; }

  const pid = data.id;

  // Optionally add address
  const addr = document.getElementById('a-address').value.trim();
  if (addr) {
    await fetch(`${API}/api/addresses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        person_id: pid,
        chain: document.getElementById('a-chain').value,
        address: addr,
        label: document.getElementById('a-label').value.trim() || null
      })
    });
  }

  // Clear form
  ['p-name','p-role','p-org','p-email','p-phone','p-tags','p-notes','a-address','a-label'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('p-risk').value = 'unknown';

  toast('人员已添加', 'success');
  await Promise.all([loadPersons(), loadGraph()]);
  switchTab('persons');
});

document.getElementById('btn-create-rel').addEventListener('click', async () => {
  const source = document.getElementById('rel-source').value;
  const target = document.getElementById('rel-target').value;
  if (source === target) { toast('不能与自己建立关系', 'error'); return; }

  const body = {
    source_id: parseInt(source),
    target_id: parseInt(target),
    type: document.getElementById('rel-type').value,
    strength: parseInt(document.getElementById('rel-strength').value),
    notes: document.getElementById('rel-notes').value.trim() || null
  };

  const res = await fetch(`${API}/api/relationships`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();

  if (!res.ok) { toast(data.error || '添加失败', 'error'); return; }
  toast('关系已建立', 'success');
  document.getElementById('rel-notes').value = '';
  await Promise.all([loadRels(), loadGraph()]);
});

async function deleteRel(id) {
  if (!confirm('删除此关系？')) return;
  await fetch(`${API}/api/relationships/${id}`, { method: 'DELETE' });
  toast('关系已删除', 'success');
  await Promise.all([loadRels(), loadGraph()]);
}

async function deleteAddr(id) {
  await fetch(`${API}/api/addresses/${id}`, { method: 'DELETE' });
  toast('地址已删除', 'success');
  if (selectedPersonId) openDetailPanel(selectedPersonId);
  await loadPersons();
}

document.getElementById('btn-delete-person').addEventListener('click', async () => {
  if (!selectedPersonId) return;
  if (!confirm('删除该人员及其所有关联数据？')) return;
  await fetch(`${API}/api/persons/${selectedPersonId}`, { method: 'DELETE' });
  toast('人员已删除', 'success');
  closeDetailPanel();
  await Promise.all([loadPersons(), loadGraph(), loadRels()]);
});

// Add address from detail panel
document.getElementById('btn-add-addr').addEventListener('click', () => {
  document.getElementById('modal-addr').classList.add('open');
});
document.getElementById('btn-modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-addr').classList.remove('open');
});
document.getElementById('btn-modal-save').addEventListener('click', async () => {
  const addr = document.getElementById('ma-address').value.trim();
  if (!addr) { toast('请填写地址', 'error'); return; }
  const body = {
    person_id: selectedPersonId,
    chain: document.getElementById('ma-chain').value,
    address: addr,
    label: document.getElementById('ma-label').value.trim() || null,
    notes: document.getElementById('ma-notes').value.trim() || null
  };
  const res = await fetch(`${API}/api/addresses`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { toast(data.error || '添加失败', 'error'); return; }
  document.getElementById('modal-addr').classList.remove('open');
  ['ma-address','ma-label','ma-notes'].forEach(id => document.getElementById(id).value = '');
  toast('地址已添加', 'success');
  openDetailPanel(selectedPersonId);
  await loadPersons();
});

// ─── Toolbar ──────────────────────────────────────────────────────────────────

document.getElementById('btn-fit').addEventListener('click', () => cy.fit(undefined, 40));
document.getElementById('btn-layout').addEventListener('click', runLayout);
document.getElementById('btn-export').addEventListener('click', () => {
  const png = cy.png({ full: true, scale: 2, bg: '#0f1117' });
  const a = document.createElement('a');
  a.href = png;
  a.download = `fund-network-${Date.now()}.png`;
  a.click();
});

document.getElementById('panel-close').addEventListener('click', closeDetailPanel);

// ─── Search ───────────────────────────────────────────────────────────────────

document.getElementById('search-input').addEventListener('input', async (e) => {
  const q = e.target.value.trim();
  if (!q) { renderPersonsList(allPersons); return; }
  const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
  const results = await res.json();
  renderPersonsList(results);
});

// ─── Tabs ─────────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${name}`));
  if (name === 'add-rel') loadRels();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ─── Toast ────────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2800);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

(async function init() {
  initCy();
  await Promise.all([loadPersons(), loadGraph()]);
})();
</script>
