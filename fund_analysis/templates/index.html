<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金分析 · 关系网络</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252836;
    --border: #2d3148;
    --accent: #5b6af0;
    --accent2: #7c8cf8;
    --text: #e2e4f0;
    --text-muted: #7b7f9a;
    --danger: #e74c3c;
    --warn: #e67e22;
    --ok: #27ae60;
    --gray: #95a5a6;
    --sidebar-w: 340px;
    --panel-w: 320px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent2);
    letter-spacing: .5px;
  }

  #sidebar-header p {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 3px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
    transition: color .2s, border-bottom .2s;
    border-bottom: 2px solid transparent;
  }

  .tab.active {
    color: var(--accent2);
    border-bottom-color: var(--accent2);
  }

  /* ── Job progress ── */
  .job-log {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    color: var(--text-muted);
    max-height: 120px;
    overflow-y: auto;
    line-height: 1.6;
  }

  .job-log .log-line { color: var(--text-muted); }
  .job-log .log-ok   { color: var(--ok); }
  .job-log .log-err  { color: var(--danger); }

  /* ── Path result ── */
  .path-chain {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .path-hop {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .path-node {
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .path-node.highlight { border-color: #f39c12; background: rgba(243,156,18,.1); }
  .path-node .node-addr { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .path-node .node-label { color: var(--text-muted); font-size: 9px; }

  .path-arrow {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    font-size: 9px;
    color: var(--text-muted);
  }

  .path-arrow .arrow-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .path-arrow .tx-val { color: var(--ok); }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Tab content */
  .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 10px; }

  /* Search */
  .search-box {
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 12px;
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--accent); }

  /* Person list */
  .person-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .person-item:hover { border-color: var(--accent); background: #1e2135; }
  .person-item.selected { border-color: var(--accent2); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }

  .person-info { flex: 1; min-width: 0; }
  .person-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

  .risk-badge {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
    flex-shrink: 0;
  }
  .risk-high { background: rgba(231,76,60,.2); color: #e74c3c; }
  .risk-medium { background: rgba(230,126,34,.2); color: #e67e22; }
  .risk-low { background: rgba(39,174,96,.2); color: #27ae60; }
  .risk-unknown { background: rgba(149,165,166,.15); color: #95a5a6; }

  /* Forms */
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
    transition: border-color .2s;
    resize: vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group select option { background: var(--surface2); }

  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-danger { background: rgba(231,76,60,.15); color: var(--danger); border: 1px solid rgba(231,76,60,.3); }
  .btn-danger:hover { background: rgba(231,76,60,.25); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  .row { display: flex; gap: 8px; }
  .row .form-group { flex: 1; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-top: 4px;
  }

  /* ── Main canvas ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #toolbar .tool-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }

  #cy {
    flex: 1;
    background: var(--bg);
  }

  /* Legend */
  #legend {
    position: absolute;
    bottom: 16px;
    left: calc(var(--sidebar-w) + 16px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
  }
  .legend-title { font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 24px; height: 2px; flex-shrink: 0; }

  /* ── Detail Panel ── */
  #detail-panel {
    width: var(--panel-w);
    background: var(--surface);
    border-left: 1px solid var(--border);
    flex-shrink: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }
  #detail-panel.open { display: flex; }

  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
  .panel-close {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .panel-close:hover { background: var(--surface2); color: var(--text); }

  .panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

  .info-block { display: flex; flex-direction: column; gap: 6px; }
  .info-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-key { color: var(--text-muted); width: 70px; flex-shrink: 0; }
  .info-val { color: var(--text); word-break: break-all; }

  .addr-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .addr-tag .chain-badge {
    background: rgba(91,106,240,.2);
    color: var(--accent2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .addr-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }

  .rel-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .rel-item:last-child { border-bottom: none; }
  .rel-type {
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    max-width: 280px;
  }
  #toast.show { opacity: 1; }
  #toast.success { border-color: var(--ok); color: var(--ok); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Empty state */
  .empty { color: var(--text-muted); text-align: center; padding: 20px 0; font-size: 12px; }

  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal h2 { font-size: 15px; font-weight: 600; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>资金关系网络</h1>
    <p>Fund Analysis · Relationship Network</p>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="persons">人员</div>
    <div class="tab" data-tab="add-person">添加</div>
    <div class="tab" data-tab="add-rel">关系</div>
    <div class="tab" data-tab="analysis">图谱分析</div>
    <div class="tab" data-tab="settings">设置</div>
  </div>

  <!-- Persons Tab -->
  <div class="tab-panel active" id="tab-persons">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索姓名、机构、地址…">
    </div>
    <div id="persons-list"></div>
  </div>

  <!-- Add Person Tab -->
  <div class="tab-panel" id="tab-add-person">
    <div class="section-title">基本信息</div>
    <div class="form-group">
      <label>姓名 *</label>
      <input type="text" id="p-name" placeholder="真实姓名或别名">
    </div>
    <div class="row">
      <div class="form-group">
        <label>角色</label>
        <input type="text" id="p-role" placeholder="投资人 / 开发者…">
      </div>
      <div class="form-group">
        <label>风险等级</label>
        <select id="p-risk">
          <option value="unknown">未知</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>所属机构</label>
      <input type="text" id="p-org" placeholder="公司 / 项目名称">
    </div>
    <div class="row">
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="p-email">
      </div>
      <div class="form-group">
        <label>电话</label>
        <input type="text" id="p-phone">
      </div>
    </div>
    <div class="form-group">
      <label>标签（逗号分隔）</label>
      <input type="text" id="p-tags" placeholder="KOL, 做市商, 黑名单…">
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="p-notes" rows="3" placeholder="其他说明…"></textarea>
    </div>

    <div class="divider"></div>
    <div class="section-title">链上地址（可选）</div>
    <div class="row">
      <div class="form-group">
        <label>链</label>
        <select id="a-chain">
          <option>ETH</option><option>BTC</option><option>BSC</option>
          <option>SOL</option><option>TRON</option><option>ARB</option>
          <option>OP</option><option>MATIC</option><option>AVAX</option><option>OTHER</option>
        </select>
      </div>
      <div class="form-group" style="flex:2">
        <label>地址</label>
        <input type="text" id="a-address" placeholder="0x…">
      </div>
    </div>
    <div class="form-group">
      <label>地址标签</label>
      <input type="text" id="a-label" placeholder="冷钱包 / 交易所充值…">
    </div>
    <button class="btn btn-primary" id="btn-create-person">添加人员</button>
  </div>

  <!-- Analysis Tab -->
  <div class="tab-panel" id="tab-analysis">

    <!-- Mode selector -->
    <div class="tabs" style="border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0">
      <div class="tab active" id="mode-path-tab" onclick="switchMode('path')" style="flex:none;padding:8px 10px">路径追踪</div>
      <div class="tab" id="mode-batch-tab" onclick="switchMode('batch')" style="flex:none;padding:8px 10px">批量分析</div>
    </div>

    <!-- Path mode -->
    <div id="mode-path">
      <div class="section-title">两地址关联路径</div>
      <div class="form-group">
        <label>地址 A（起点）</label>
        <input type="text" id="path-addr-a" placeholder="0x… 或 TRX 地址">
      </div>
      <div class="form-group">
        <label>地址 B（终点）</label>
        <input type="text" id="path-addr-b" placeholder="0x… 或 TRX 地址">
      </div>
      <div class="row">
        <div class="form-group">
          <label>链</label>
          <select id="path-chain">
            <option>ETH</option><option>BSC</option><option>ARB</option>
            <option>OP</option><option>MATIC</option><option>TRON</option>
          </select>
        </div>
        <div class="form-group">
          <label>最大跳数</label>
          <select id="path-depth">
            <option value="1">1 跳（直接）</option>
            <option value="2" selected>2 跳</option>
            <option value="3">3 跳</option>
            <option value="4">4 跳（慢）</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-find-path" style="width:100%">开始追踪</button>
    </div>

    <!-- Batch mode -->
    <div id="mode-batch" style="display:none">
      <div class="section-title">多地址关系网络（最多10个）</div>
      <div class="form-group">
        <label>地址列表（每行一个）</label>
        <textarea id="batch-addrs" rows="6" placeholder="0x1234…&#10;0x5678…&#10;TRx..."></textarea>
      </div>
      <div class="form-group">
        <label>链</label>
        <select id="batch-chain">
          <option>ETH</option><option>BSC</option><option>ARB</option>
          <option>OP</option><option>MATIC</option><option>TRON</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btn-batch-analyze" style="width:100%">批量分析</button>
    </div>

    <!-- Job status -->
    <div id="analysis-status" style="display:none">
      <div class="status-row">
        <div class="spinner" id="analysis-spinner"></div>
        <span id="analysis-status-text">初始化中…</span>
        <button class="btn btn-ghost btn-sm" id="btn-stop-analysis" style="margin-left:auto">停止</button>
      </div>
      <div class="job-log" id="analysis-log"></div>
    </div>

    <!-- Path result -->
    <div id="path-result" style="display:none">
      <div class="section-title" id="path-result-title">关联路径</div>
      <div class="path-chain" id="path-chain-view"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-ghost btn-sm" id="btn-highlight-path" style="flex:1">在图中高亮</button>
        <button class="btn btn-ghost btn-sm" id="btn-add-path-to-graph" style="flex:1">保存到图谱</button>
      </div>
    </div>

    <!-- Batch result summary -->
    <div id="batch-result" style="display:none">
      <div class="section-title" id="batch-result-title">分析结果</div>
      <div id="batch-result-body"></div>
      <button class="btn btn-primary btn-sm" id="btn-load-batch-graph" style="width:100%;margin-top:8px">载入图谱并刷新</button>
    </div>
  </div>

  <!-- Settings Tab -->
  <div class="tab-panel" id="tab-settings">
    <div class="section-title">区块链 API 密钥</div>
    <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
      无密钥时使用公共接口（限速）。推荐申请免费 API Key 以提升速度。
    </p>
    <div class="form-group">
      <label>Etherscan API Key（ETH/ARB/OP）</label>
      <input type="text" id="cfg-eth-key" placeholder="留空使用公共接口">
    </div>
    <div class="form-group">
      <label>BscScan API Key（BSC）</label>
      <input type="text" id="cfg-bsc-key" placeholder="留空使用公共接口">
    </div>
    <div class="form-group">
      <label>PolygonScan API Key（MATIC）</label>
      <input type="text" id="cfg-matic-key" placeholder="留空使用公共接口">
    </div>
    <div class="form-group">
      <label>TronGrid API Key（TRON）</label>
      <input type="text" id="cfg-tron-key" placeholder="留空使用公共接口">
    </div>
    <button class="btn btn-primary" id="btn-save-config" style="width:100%">保存密钥</button>
    <p style="font-size:10px;color:var(--text-muted);margin-top:6px">
      密钥保存在本地 config.json，不会上传。
    </p>
  </div>

  <!-- Add Relationship Tab -->
  <div class="tab-panel" id="tab-add-rel">
    <div class="section-title">建立关系</div>
    <div class="form-group">
      <label>人员 A</label>
      <select id="rel-source"></select>
    </div>
    <div class="form-group">
      <label>关系类型</label>
      <select id="rel-type">
        <option value="colleague">同事</option>
        <option value="collaborator">合作伙伴</option>

<div id="detail-panel">

      <div class="section-title" style="margin-bottom:8px">链上地址</div>

<!-- Add Address Modal -->
<div class="modal-overlay" id="modal-addr">
  <div class="modal">
    <h2>添加链上地址</h2>
    <div class="row">
      <div class="form-group">
        <label>链</label>
        <select id="ma-chain">
          <option>ETH</option><option>BTC</option><option>BSC</option>
          <option>SOL</option><option>TRON</option><option>ARB</option>
          <option>OP</option><option>MATIC</option><option>AVAX</option><option>OTHER</option>
        </select>
      </div>
      <div class="form-group" style="flex:2">
        <label>地址 *</label>
        <input type="text" id="ma-address" placeholder="0x…">
      </div>
    </div>
    <div class="form-group">
      <label>标签</label>
      <input type="text" id="ma-label" placeholder="冷钱包 / 热钱包…">
    </div>
    <div class="form-group">
      <label>备注</label>
      <input type="text" id="ma-notes">
    </div>

      <button class="btn btn-ghost" id="btn-modal-cancel" style="flex:1">取消</button>
      <button class="btn btn-primary" id="btn-modal-save" style="flex:1">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';
let cy = null;
let selectedPersonId = null;
let allPersons = [];

// ─── Cytoscape Init ──────────────────────────────────────────────────────────

function edgeColor(type) {
  const map = {
    colleague: '#7c8cf8',
    collaborator: '#5b6af0',
    friend: '#f39c12',
    family: '#e67e22',
    investor: '#27ae60',
    suspicious: '#e74c3c',
    other: '#95a5a6'
  };
  return map[type] || '#95a5a6';
}

function initCy() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      {
        selector: 'node',
        style: {
          'background-color': 'data(color)',
          'label': 'data(label)',
          'color': '#e2e4f0',
          'font-size': '11px',
          'font-family': 'SF Pro Display, PingFang SC, system-ui, sans-serif',
          'text-valign': 'bottom',
          'text-margin-y': '4px',
          'text-outline-color': '#0f1117',
          'text-outline-width': '2px',
          'width': '36px',
          'height': '36px',
          'border-width': '2px',
          'border-color': '#2d3148',
          'transition-property': 'border-color, width, height',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'node:selected',
        style: {
          'border-color': '#7c8cf8',
          'border-width': '3px',
          'width': '42px',
          'height': '42px'
        }
      },
      {
        selector: 'edge',
        style: {
          'line-color': 'data(edgeColor)',
          'target-arrow-color': 'data(edgeColor)',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'width': 'data(edgeWidth)',
          'label': 'data(label)',
          'color': '#7b7f9a',
          'font-size': '9px',
          'text-rotation': 'autorotate',
          'opacity': 0.7
        }
      },
      {
        selector: 'edge:selected',
        style: {
          'opacity': 1,
          'width': 3
        }
      }
    ],
    layout: { name: 'cose' },
    wheelSensitivity: 0.3
  });

  cy.on('tap', 'node', function(e) {
    const node = e.target;
    openDetailPanel(parseInt(node.id()));
  });

  cy.on('tap', function(e) {
    if (e.target === cy) closeDetailPanel();
  });
}

// ─── Graph Data ───────────────────────────────────────────────────────────────

async function loadGraph() {
  const res = await fetch(`${API}/api/graph`);
  const data = await res.json();

  cy.elements().remove();

  const nodes = data.nodes.map(n => ({
    data: { ...n.data, edgeColor: '#2d3148' }
  }));

  const edges = data.edges.map(e => ({
    data: {
      ...e.data,
      edgeColor: edgeColor(e.data.type),
      edgeWidth: Math.max(1, (e.data.strength || 1) * 0.8)
    }
  }));

  cy.add([...nodes, ...edges]);
  runLayout();
}

function runLayout() {
  cy.layout({
    name: 'cose',
    animate: true,
    animationDuration: 600,
    nodeRepulsion: 4500,
    idealEdgeLength: 120,
    gravity: 0.4
  }).run();
}

// ─── Persons List ─────────────────────────────────────────────────────────────

async function loadPersons() {
  const res = await fetch(`${API}/api/persons`);
  allPersons = await res.json();
  renderPersonsList(allPersons);
  populateRelSelects(allPersons);
}

function renderPersonsList(persons) {
  const el = document.getElementById('persons-list');
  if (persons.length === 0) {
    el.innerHTML = '<div class="empty">暂无人员，请先添加</div>';
    return;
  }
  el.innerHTML = persons.map(p => {
    const initials = (p.name || '?').slice(0, 2).toUpperCase();
    const color = { high: '#e74c3c', medium: '#e67e22', low: '#27ae60', unknown: '#5b6af0' }[p.risk_level] || '#5b6af0';
    const addrCount = (p.addresses || []).length;
    return `
      <div class="person-item" data-id="${p.id}" onclick="openDetailPanel(${p.id})">
        <div class="avatar" style="background:${color}">${initials}</div>
        <div class="person-info">
          <div class="person-name">${p.name}</div>
          <div class="person-meta">${p.organization || p.role || '—'} · ${addrCount} 个地址</div>
        </div>
        <span class="risk-badge risk-${p.risk_level || 'unknown'}">${riskLabel(p.risk_level)}</span>
      </div>`;
  }).join('');
}

function riskLabel(r) {
  return { high: '高', medium: '中', low: '低', unknown: '?' }[r] || '?';
}

function populateRelSelects(persons) {
  ['rel-source', 'rel-target'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  });
}

// ─── Relationships List ───────────────────────────────────────────────────────

async function loadRels() {
  const res = await fetch(`${API}/api/relationships`);
  const rels = await res.json();
  const el = document.getElementById('rels-list');
  if (rels.length === 0) {
    el.innerHTML = '<div class="empty">暂无关系</div>';
    return;
  }
  const typeLabels = { colleague:'同事', collaborator:'合作', friend:'朋友', family:'家人', investor:'投资', suspicious:'可疑', other:'其他' };
  el.innerHTML = rels.map(r => `
    <div class="rel-item">
      <span style="flex:1">${r.source_name}</span>
      <span class="rel-type" style="background:${edgeColor(r.type)}22;color:${edgeColor(r.type)}">${typeLabels[r.type]||r.type}</span>
      <span style="flex:1;text-align:right">${r.target_name}</span>
      <button class="btn btn-danger btn-sm" onclick="deleteRel(${r.id})" style="margin-left:6px;padding:3px 7px">✕</button>
    </div>`).join('');
}

// ─── Detail Panel ─────────────────────────────────────────────────────────────

async function openDetailPanel(pid) {
  selectedPersonId = pid;
  const res = await fetch(`${API}/api/persons/${pid}`);
  const p = await res.json();

  const initials = (p.name || '?').slice(0, 2).toUpperCase();
  const color = { high: '#e74c3c', medium: '#e67e22', low: '#27ae60', unknown: '#5b6af0' }[p.risk_level] || '#5b6af0';

  document.getElementById('detail-avatar').textContent = initials;
  document.getElementById('detail-avatar').style.background = color;
  document.getElementById('detail-name').textContent = p.name;

  const fields = [
    ['角色', p.role], ['机构', p.organization],
    ['邮箱', p.email], ['电话', p.phone],
    ['风险', riskLabel(p.risk_level)],
    ['标签', p.tags], ['备注', p.notes]
  ].filter(([, v]) => v);

  document.getElementById('detail-info').innerHTML = fields.length
    ? fields.map(([k, v]) => `<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v}</span></div>`).join('')
    : '<div class="info-row"><span class="info-val" style="color:var(--text-muted)">无基本信息</span></div>';

  const addrs = p.addresses || [];
  document.getElementById('detail-addresses').innerHTML = addrs.length
    ? addrs.map(a => `
        <div class="addr-tag" style="margin-bottom:6px">
          <span class="chain-badge">${a.chain}</span>
          <span class="addr-text" title="${a.address}">${a.label ? a.label + ': ' : ''}${a.address}</span>
          <button onclick="deleteAddr(${a.id})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px">✕</button>
        </div>`).join('')
    : '<div class="empty">无链上地址</div>';

  // Relationships involving this person
  const relRes = await fetch(`${API}/api/relationships`);
  const allRels = await relRes.json();
  const myRels = allRels.filter(r => r.source_id === pid || r.target_id === pid);
  const typeLabels = { colleague:'同事', collaborator:'合作', friend:'朋友', family:'家人', investor:'投资', suspicious:'可疑', other:'其他' };

  document.getElementById('detail-rels').innerHTML = myRels.length
    ? myRels.map(r => {
        const other = r.source_id === pid ? r.target_name : r.source_name;
        return `<div class="rel-item">
          <span class="rel-type" style="background:${edgeColor(r.type)}22;color:${edgeColor(r.type)}">${typeLabels[r.type]||r.type}</span>
          <span style="flex:1">${other}</span>
        </div>`;
      }).join('')
    : '<div class="empty">无关系记录</div>';

  document.getElementById('detail-panel').classList.add('open');

  // Highlight node
  cy.elements().removeClass('selected');
  cy.$(`#${pid}`).select();
}

function closeDetailPanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedPersonId = null;
  cy.elements().unselect();
}

// ─── CRUD Actions ─────────────────────────────────────────────────────────────

document.getElementById('btn-create-person').addEventListener('click', async () => {
  const name = document.getElementById('p-name').value.trim();
  if (!name) { toast('请填写姓名', 'error'); return; }

  const body = {
    name,
    role: document.getElementById('p-role').value.trim() || null,
    organization: document.getElementById('p-org').value.trim() || null,
    email: document.getElementById('p-email').value.trim() || null,
    phone: document.getElementById('p-phone').value.trim() || null,
    tags: document.getElementById('p-tags').value.trim() || null,
    notes: document.getElementById('p-notes').value.trim() || null,
    risk_level: document.getElementById('p-risk').value
  };

  const res = await fetch(`${API}/api/persons`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();

  if (!res.ok) { toast(data.error || '添加失败', 'error'); return; }

  const pid = data.id;

  // Optionally add address
  const addr = document.getElementById('a-address').value.trim();
  if (addr) {
    await fetch(`${API}/api/addresses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        person_id: pid,
        chain: document.getElementById('a-chain').value,
        address: addr,
        label: document.getElementById('a-label').value.trim() || null
      })
    });
  }

  // Clear form
  ['p-name','p-role','p-org','p-email','p-phone','p-tags','p-notes','a-address','a-label'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('p-risk').value = 'unknown';

  toast('人员已添加', 'success');
  await Promise.all([loadPersons(), loadGraph()]);
  switchTab('persons');
});

document.getElementById('btn-create-rel').addEventListener('click', async () => {
  const source = document.getElementById('rel-source').value;
  const target = document.getElementById('rel-target').value;
  if (source === target) { toast('不能与自己建立关系', 'error'); return; }

  const body = {
    source_id: parseInt(source),
    target_id: parseInt(target),
    type: document.getElementById('rel-type').value,
    strength: parseInt(document.getElementById('rel-strength').value),
    notes: document.getElementById('rel-notes').value.trim() || null
  };

  const res = await fetch(`${API}/api/relationships`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();

  if (!res.ok) { toast(data.error || '添加失败', 'error'); return; }
  toast('关系已建立', 'success');
  document.getElementById('rel-notes').value = '';
  await Promise.all([loadRels(), loadGraph()]);
});

async function deleteRel(id) {
  if (!confirm('删除此关系？')) return;
  await fetch(`${API}/api/relationships/${id}`, { method: 'DELETE' });
  toast('关系已删除', 'success');
  await Promise.all([loadRels(), loadGraph()]);
}

async function deleteAddr(id) {
  await fetch(`${API}/api/addresses/${id}`, { method: 'DELETE' });
  toast('地址已删除', 'success');
  if (selectedPersonId) openDetailPanel(selectedPersonId);
  await loadPersons();
}

document.getElementById('btn-delete-person').addEventListener('click', async () => {
  if (!selectedPersonId) return;
  if (!confirm('删除该人员及其所有关联数据？')) return;
  await fetch(`${API}/api/persons/${selectedPersonId}`, { method: 'DELETE' });
  toast('人员已删除', 'success');
  closeDetailPanel();
  await Promise.all([loadPersons(), loadGraph(), loadRels()]);
});

// Add address from detail panel
document.getElementById('btn-add-addr').addEventListener('click', () => {
  document.getElementById('modal-addr').classList.add('open');
});
document.getElementById('btn-modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-addr').classList.remove('open');
});
document.getElementById('btn-modal-save').addEventListener('click', async () => {
  const addr = document.getElementById('ma-address').value.trim();
  if (!addr) { toast('请填写地址', 'error'); return; }
  const body = {
    person_id: selectedPersonId,
    chain: document.getElementById('ma-chain').value,
    address: addr,
    label: document.getElementById('ma-label').value.trim() || null,
    notes: document.getElementById('ma-notes').value.trim() || null
  };
  const res = await fetch(`${API}/api/addresses`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { toast(data.error || '添加失败', 'error'); return; }
  document.getElementById('modal-addr').classList.remove('open');
  ['ma-address','ma-label','ma-notes'].forEach(id => document.getElementById(id).value = '');
  toast('地址已添加', 'success');
  openDetailPanel(selectedPersonId);
  await loadPersons();
});

// ─── Toolbar ──────────────────────────────────────────────────────────────────

document.getElementById('btn-fit').addEventListener('click', () => cy.fit(undefined, 40));
document.getElementById('btn-layout').addEventListener('click', runLayout);
document.getElementById('btn-export').addEventListener('click', () => {
  const png = cy.png({ full: true, scale: 2, bg: '#0f1117' });
  const a = document.createElement('a');
  a.href = png;
  a.download = `fund-network-${Date.now()}.png`;
  a.click();
});

document.getElementById('panel-close').addEventListener('click', closeDetailPanel);

// ─── Search ───────────────────────────────────────────────────────────────────

document.getElementById('search-input').addEventListener('input', async (e) => {
  const q = e.target.value.trim();
  if (!q) { renderPersonsList(allPersons); return; }
  const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
  const results = await res.json();
  renderPersonsList(results);
});

// ─── Tabs ─────────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('#sidebar .tabs > .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${name}`));
  if (name === 'add-rel') loadRels();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ─── Toast ────────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2800);
}

// ─── Analysis Tab ─────────────────────────────────────────────────────────────

let currentJobId = null;
let jobPollTimer = null;
let currentPathData = null;
let currentBatchData = null;

function switchMode(mode) {
  document.getElementById('mode-path').style.display = mode === 'path' ? '' : 'none';
  document.getElementById('mode-batch').style.display = mode === 'batch' ? '' : 'none';
  document.getElementById('mode-path-tab').classList.toggle('active', mode === 'path');
  document.getElementById('mode-batch-tab').classList.toggle('active', mode === 'batch');
}

function showJobStatus(show) {
  document.getElementById('analysis-status').style.display = show ? '' : 'none';
  if (!show) {
    document.getElementById('analysis-spinner').style.display = '';
  }
}

function appendLog(msg, type = '') {
  const log = document.getElementById('analysis-log');
  const line = document.createElement('div');
  line.className = `log-line ${type ? 'log-' + type : ''}`;
  line.textContent = '› ' + msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function clearLog() {
  document.getElementById('analysis-log').innerHTML = '';
}

function startPolling(jobId, onDone) {
  currentJobId = jobId;
  let lastProgressLen = 0;
  jobPollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API}/api/jobs/${jobId}`);
      const job = await res.json();
      // Append new progress lines
      const lines = job.progress || [];
      for (let i = lastProgressLen; i < lines.length; i++) {
        appendLog(lines[i]);
      }
      lastProgressLen = lines.length;
      document.getElementById('analysis-status-text').textContent =
        lines[lines.length - 1] || '运行中…';

      if (job.status === 'done' || job.status === 'error') {
        clearInterval(jobPollTimer);
        jobPollTimer = null;
        document.getElementById('analysis-spinner').style.display = 'none';
        if (job.status === 'error') {
          appendLog('错误: ' + job.error, 'err');
          document.getElementById('analysis-status-text').textContent = '分析失败';
        } else {
          appendLog('完成', 'ok');
          document.getElementById('analysis-status-text').textContent = '完成';
          onDone(job.result);
        }
      }
    } catch (e) {
      appendLog('轮询失败: ' + e.message, 'err');
    }
  }, 1000);
}

// Path finding
document.getElementById('btn-find-path').addEventListener('click', async () => {
  const addrA = document.getElementById('path-addr-a').value.trim();
  const addrB = document.getElementById('path-addr-b').value.trim();
  const chain = document.getElementById('path-chain').value;
  const depth = document.getElementById('path-depth').value;

  if (!addrA || !addrB) { toast('请填写两个地址', 'error'); return; }

  clearLog();
  showJobStatus(true);
  document.getElementById('path-result').style.display = 'none';

  const res = await fetch(`${API}/api/find-path`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ addr_a: addrA, addr_b: addrB, chain, max_depth: parseInt(depth) })
  });
  const data = await res.json();
  if (!res.ok) { toast(data.error || '请求失败', 'error'); return; }

  startPolling(data.job_id, (result) => {
    currentPathData = result;
    renderPathResult(result, addrA, addrB);
    loadPersons();
    loadGraph();
  });
});

function renderPathResult(result, addrA, addrB) {
  const el = document.getElementById('path-result');
  const title = document.getElementById('path-result-title');
  const view = document.getElementById('path-chain-view');

  if (!result.found || !result.path) {
    title.textContent = '未找到关联路径';
    view.innerHTML = '<div class="empty" style="color:var(--danger)">在指定跳数内未发现交易路径，可尝试增加跳数或检查地址</div>';
    el.style.display = '';
    return;
  }

  const path = result.path;
  const hops = path.length - 1;
  title.textContent = `发现路径（${hops} 跳）`;

  view.innerHTML = path.map((hop, i) => {
    const isFirst = i === 0;
    const isLast = i === path.length - 1;
    const addrShort = hop.address.length > 20
      ? hop.address.slice(0, 10) + '…' + hop.address.slice(-8)
      : hop.address;
    const label = isFirst ? '起点' : isLast ? '终点' : `中间 ${i}`;
    const nodeClass = (isFirst || isLast) ? 'path-node highlight' : 'path-node';

    let arrow = '';
    if (!isFirst) {
      const val = hop.value && hop.value !== '0' ? `${hop.value}` : '';
      const txShort = hop.tx_hash ? hop.tx_hash.slice(0, 10) + '…' : '';
      arrow = `<div class="path-arrow">
        <div class="arrow-line"></div>
        <span>${txShort}</span>
        ${val ? `<span class="tx-val">${val}</span>` : ''}
        <div class="arrow-line"></div>
        ▼
      </div>`;
    }

    return `${arrow}<div class="${nodeClass}">
      <span class="node-label">${label}</span>
      <span class="node-addr" title="${hop.address}">${addrShort}</span>
      ${hop.tx_hash ? `<a href="javascript:void(0)" onclick="copyText('${hop.tx_hash}')" style="color:var(--accent2);font-size:9px">复制TX</a>` : ''}
    </div>`;
  }).join('');

  el.style.display = '';
}

document.getElementById('btn-highlight-path').addEventListener('click', () => {
  if (!currentPathData || !currentPathData.path) return;
  highlightPath(currentPathData.path);
});

document.getElementById('btn-add-path-to-graph').addEventListener('click', async () => {
  toast('节点已在分析时自动保存', 'success');
  await Promise.all([loadPersons(), loadGraph()]);
});

function highlightPath(path) {
  // Reset all highlights
  cy.elements().removeClass('path-highlight');
  cy.nodes().style({ 'border-color': '#2d3148', 'border-width': '2px' });
  cy.edges().style({ 'opacity': 0.7 });

  const addrs = path.map(h => h.address.toLowerCase());

  // Highlight matching nodes
  cy.nodes().forEach(node => {
    // We match by looking up address mapping (stored in label or we search persons)
    const nodeId = node.id();
    if (addrs.some(a => node.data('label').toLowerCase().includes(a.slice(0, 8)))) {
      node.style({ 'border-color': '#f39c12', 'border-width': '3px' });
    }
  });

  // Flash
  toast('已高亮路径节点（橙色边框）', 'success');
}

// Batch analysis
document.getElementById('btn-batch-analyze').addEventListener('click', async () => {
  const raw = document.getElementById('batch-addrs').value.trim();
  const addresses = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const chain = document.getElementById('batch-chain').value;

  if (addresses.length < 1) { toast('请输入至少1个地址', 'error'); return; }
  if (addresses.length > 10) { toast('最多10个地址', 'error'); return; }

  clearLog();
  showJobStatus(true);
  document.getElementById('batch-result').style.display = 'none';

  const res = await fetch(`${API}/api/analyze-addresses`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ addresses, chain })
  });
  const data = await res.json();
  if (!res.ok) { toast(data.error || '请求失败', 'error'); return; }

  startPolling(data.job_id, (result) => {
    currentBatchData = result;
    renderBatchResult(result, addresses);
    loadPersons();
    loadGraph();
  });
});

function renderBatchResult(result, inputAddrs) {
  const el = document.getElementById('batch-result');
  const title = document.getElementById('batch-result-title');
  const body = document.getElementById('batch-result-body');

  const nodeCount = result.nodes ? result.nodes.length : 0;
  const edgeCount = result.edges ? result.edges.length : 0;
  const pathCount = result.paths ? Object.keys(result.paths).length : 0;

  title.textContent = `发现 ${nodeCount} 个节点，${edgeCount} 条交易`;

  let html = `<div class="info-row"><span class="info-key">输入地址</span><span class="info-val">${inputAddrs.length} 个</span></div>
    <div class="info-row"><span class="info-key">关联地址</span><span class="info-val">${nodeCount} 个</span></div>
    <div class="info-row"><span class="info-key">交易边</span><span class="info-val">${edgeCount} 条</span></div>
    <div class="info-row"><span class="info-key">直接关联对</span><span class="info-val">${pathCount} 对</span></div>`;

  if (pathCount > 0) {
    html += '<div style="margin-top:8px;font-size:11px;color:var(--ok)">✓ 发现直接关联：</div>';
    for (const [key, path] of Object.entries(result.paths || {})) {
      const [a, b] = key.split(':');
      html += `<div class="rel-item" style="font-size:10px;font-family:monospace">
        ${a.slice(0,8)}… ↔ ${b.slice(0,8)}…
        <span style="color:var(--ok);font-size:9px">直接交易</span>
      </div>`;
    }
  }

  body.innerHTML = html;
  el.style.display = '';
}

document.getElementById('btn-load-batch-graph').addEventListener('click', async () => {
  await Promise.all([loadPersons(), loadGraph()]);
  toast('已刷新图谱', 'success');
  switchTab('persons');
});

document.getElementById('btn-stop-analysis').addEventListener('click', () => {
  if (jobPollTimer) {
    clearInterval(jobPollTimer);
    jobPollTimer = null;
    appendLog('已手动停止', 'err');
    document.getElementById('analysis-spinner').style.display = 'none';
    document.getElementById('analysis-status-text').textContent = '已停止';
  }
});

// ─── Settings ─────────────────────────────────────────────────────────────────

document.getElementById('btn-save-config').addEventListener('click', async () => {
  const cfg = {
    ETH_KEY:  document.getElementById('cfg-eth-key').value.trim() || null,
    BSC_KEY:  document.getElementById('cfg-bsc-key').value.trim() || null,
    MATIC_KEY: document.getElementById('cfg-matic-key').value.trim() || null,
    TRON_KEY: document.getElementById('cfg-tron-key').value.trim() || null,
  };
  const res = await fetch(`${API}/api/config`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cfg)
  });
  if (res.ok) toast('密钥已保存', 'success');
  else toast('保存失败', 'error');
});

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('已复制', 'success'));
}

// ─── Init ─────────────────────────────────────────────────────────────────────

(async function init() {
  initCy();
  await Promise.all([loadPersons(), loadGraph()]);
})();
</script>
</body>
